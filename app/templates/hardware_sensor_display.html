{% extends 'base.html' %}

{% block head %}
<link rel="stylesheet"
      href="/static/css/hardware_control.css">
{% endblock %}

{% block title %}
Status Display
{% endblock %}

{% block content %}


<div id="hardware-control"
     data-config='{{ config | tojson | e }}'
     data-status-url='{{ url_for("hardware-sensor-display.status", file=test_file or None) }}'>

	<h1>Status Display</h1>

	{% if test_file %}
	<p><strong>Test mode:</strong> showing the local file <code>{{ test_file }}</code>, not the controllers.</p>
	{% endif %}

	<div id="last-update">
		Last update: —
	</div>

	<div id="alarm-board" class="alarm-board">

		<div class="alarm-board-title">
			Active alarms
		</div>

		<div id="alarm-list">
		</div>

	</div>

	<div id="sensors"></div>


	<div id="alarm-overlay" class="alarm-overlay">

		<div class="alarm-popup">

			<div class="alarm-title">
				⚠ Alarm
			</div>

			<div id="alarm-message"
				 class="alarm-message">
			</div>

			<button id="alarm-acknowledge"
					class="alarm-acknowledge">
				Acknowledge
			</button>

		</div>

	</div>


</div>

<script src="{{ url_for('static', filename='js/hardware_sensor_display.js') }}"></script>

{% endblock %}
