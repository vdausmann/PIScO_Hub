{% extends 'base.html' %}
{% block content %}

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h1>Global Settings</h1>
    <a href="{{ url_for('index') }}" style="color: var(--accent); text-decoration: none;">&larr; Dashboard</a>
</div>

<form method="POST">
    <table class="table">
        <thead>
            <tr>
                <th>Setting</th>
                <th>Value</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            {% for s in settings %}
            <tr>
                <td><strong>{{ s.key }}</strong></td>
                <td>
                    <input type="text" name="{{ s.key }}" value="{{ s.value }}" class="form-control">
                </td>
                <td><small class="text-muted">{{ s.description }}</small></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button type="submit" class="btn btn-primary">Save Configuration</button>
</form>

{% endblock %}
