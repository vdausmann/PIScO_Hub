<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PIScO Hub{% endblock %}</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card: #fff; --accent: #2563eb; }
        [data-theme="dark"] { --bg: #1a1a1a; --text: #e5e7eb; --card: #2d2d2d; --accent: #60a5fa; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; transition: 0.3s; }
        .nav { padding: 1rem; display: flex; justify-content: space-between; background: var(--card); }
        .container { padding: 2rem; }
        button { cursor: pointer; border-radius: 4px; border: none; padding: 8px 16px; }
        .nav a { color: var(--accent); }
		.nav a:hover b {
			opacity: 0.7;
			transition: 0.2s;
		}
    </style>

	<link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
	<!-- TODO: make this local -->
	<script src="{{ url_for('static', filename='htmx.min.js') }}"></script>

    {% block head %}
    {% endblock %}
</head>
<body>
	<div id="global-loader" class="loader-overlay" style="display: none;">
		<div class="loader-box">
			<div class="spinner"></div>
			<p class="loader-text">PROCESSING_REQUEST...</p>
		</div>
	</div>

	<style>
		/* Full-screen darkening overlay */
		.loader-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background: rgba(15, 23, 42, 0.7); /* Translucent dark tint matching your theme */
			backdrop-filter: blur(4px); /* Slight blur for a premium look */
			z-index: 9999; /* Stay on top of everything */
			display: flex;
			justify-content: center;
			align-items: center;
		}

		/* Container block for the spinner and text */
		.loader-box {
			background: #1e293b;
			border: 1px solid #334155;
			padding: 2rem;
			border-radius: 8px;
			text-align: center;
			font-family: monospace;
			box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
		}

		/* The rotating CSS spinner */
		.spinner {
			width: 40px;
			height: 40px;
			border: 4px solid #334155;
			border-top-color: #3b82f6; /* Your accent blue color */
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin: 0 auto 1rem;
		}

		.loader-text {
			color: #f1f5f9;
			font-size: 0.8rem;
			font-weight: bold;
			letter-spacing: 1px;
			margin: 0;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}
	</style>


    <nav class="nav">
		<a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit;">
			<span><c>PIScOHub</c></span>
		</a>
        <div>
            <button id="theme-toggle">🌓 Theme</button>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>


    <script>
        const btn = document.getElementById('theme-toggle');
        const setTheme = (t) => {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
        };
        if (localStorage.getItem('theme')) setTheme(localStorage.getItem('theme'));
        btn.onclick = () => {
            let t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            setTheme(t);
        };
    </script>

	<script>
		const loader = document.getElementById('global-loader');

		// htmx polls in the background (the dashboard refreshes every 2s).
		// Those requests must not blank the screen, so they are counted and
		// skipped by the interceptors below.
		let backgroundRequests = 0;
		document.addEventListener('htmx:beforeRequest', () => backgroundRequests++);
		document.addEventListener('htmx:afterRequest', () => backgroundRequests--);

		const showLoader = () => { if (backgroundRequests === 0) loader.style.display = 'flex'; };
		const hideLoader = () => { if (backgroundRequests === 0) loader.style.display = 'none'; };

		// --- 1. Standard HTML Forms & Links (From Previous Step) ---
		document.addEventListener('submit', () => loader.style.display = 'flex');
		document.addEventListener('click', (e) => {
			const target = e.target.closest('a');
			if (target && target.href && !target.target && !target.href.startsWith('javascript:') && !target.getAttribute('href').startsWith('#')) {
				loader.style.display = 'flex';
			}
		});
		window.addEventListener('pageshow', (e) => { if (e.persisted) loader.style.display = 'none'; });

		// --- 2. UNIVERSAL BACKGROUND INTERCEPTOR (Fetch API) ---
		const { fetch: originalFetch } = window;

		window.fetch = async (input, options = {}) => {

			const showGlobalLoader =
				options.showLoader !== false;

			if (showGlobalLoader) {
				showLoader();
			}

			try {

				/*
				 * Remove our custom option before passing the
				 * options to the actual browser fetch function.
				 */
				const { showLoader, ...fetchOptions } = options;

				return await originalFetch(
					input,
					fetchOptions
				);

			} finally {

				if (showGlobalLoader) {
					hideLoader();
				}
			}
		};

		// --- 3. UNIVERSAL BACKGROUND INTERCEPTOR (Older AJAX / XMLHttpRequest) ---
		// Just in case your HDF5 viewer plugin uses older jQuery or raw XHR calls
		const open = XMLHttpRequest.prototype.open;
		XMLHttpRequest.prototype.open = function(...args) {
			this.addEventListener('loadstart', showLoader);
			this.addEventListener('loadend', hideLoader);
			return open.apply(this, args);
		};
	</script>


{% block scripts %}{% endblock %}</body>
</html>
