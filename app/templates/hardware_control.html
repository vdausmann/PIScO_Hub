{% extends 'base.html' %}

{% block head %}

<link rel="stylesheet" href="{{ url_for( 'static', filename='css/hardware_control.css') }}">

{% endblock %}

{% block title %}
Hardware Control
{% endblock %}

{% block content %}

<div class="hardware-header">

<h1>
    Hardware Control
</h1>

<a
    href="{{ url_for('index') }}"
    class="dashboard-link"
>
    &larr; Dashboard
</a>

</div>

<div class="control-panel">

<label for="file-select">
    Sensor data:
</label>

<select id="file-select">

    <option value="">
        Select a file...
    </option>

</select>

</div>

<p id="status">
    No sensor file selected.
</p>

<div id="hardware-layout">

<!--
    Device sections are generated from
    the hardware configuration.
-->

</div>

{% endblock %}

{% block scripts %}

<script>


/*
 * Hardware configuration supplied by Flask.
 *
 * Jinja converts the Python dictionary
 * into a JavaScript object.
 */

const hardwareConfig =
    {{ config | tojson }};


const fileSelect =
    document.getElementById(
        "file-select"
    );

const hardwareLayout =
    document.getElementById(
        "hardware-layout"
    );

const statusElement =
    document.getElementById(
        "status"
    );


let pollingGeneration = 0;

let updateTimeout = null;


/*
 * Create the complete hardware layout
 * from the configuration.
 *
 * This is only called once when the
 * page is loaded.
 */

function createHardwareLayout() {

    for (
        const [deviceName, device]
        of Object.entries(
            hardwareConfig
        )
    ) {

        /*
         * Device section
         */

        const deviceSection =
            document.createElement(
                "section"
            );

        deviceSection.className =
            "device-section";


        /*
         * Device title
         */

        const deviceTitle =
            document.createElement(
                "h2"
            );

        deviceTitle.className =
            "device-title";

        deviceTitle.textContent =
            deviceName;


        deviceSection.appendChild(
            deviceTitle
        );


        /*
         * Device content
         */

        const deviceContent =
            document.createElement(
                "div"
            );

        deviceContent.className =
            "device-content";


        /*
         * Group sensors by their
         * configured group.
         */

        const groups = {};


        for (
            const sensor
            of (device.sensors || [])
        ) {

            const group =
                sensor.group || "Sensors";


            if (!groups[group]) {

                groups[group] = [];
            }


            groups[group].push(
                sensor
            );
        }


        /*
         * Create each sensor group.
         */

        for (
            const [groupName, sensors]
            of Object.entries(groups)
        ) {

            const groupElement =
                document.createElement(
                    "div"
                );

            groupElement.className =
                "sensor-group";


            /*
             * Group title
             */

            const groupTitle =
                document.createElement(
                    "h3"
                );

            groupTitle.className =
                "group-title";

            groupTitle.textContent =
                groupName;


            groupElement.appendChild(
                groupTitle
            );


            /*
             * Sensor grid
             */

            const sensorGrid =
                document.createElement(
                    "div"
                );

            sensorGrid.className =
                "sensor-grid";


            /*
             * Create each sensor from
             * the configuration.
             */

            for (
                const sensor
                of sensors
            ) {

                const sensorElement =
                    createSensorElement(
                        deviceName,
                        sensor
                    );


                sensorGrid.appendChild(
                    sensorElement
                );
            }


            groupElement.appendChild(
                sensorGrid
            );


            deviceContent.appendChild(
                groupElement
            );
        }


        deviceSection.appendChild(
            deviceContent
        );


        hardwareLayout.appendChild(
            deviceSection
        );
    }
}


/*
 * Create one sensor display element.
 */

function createSensorElement(
    deviceName,
    sensor
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "sensor-entry";


    /*
     * The shorthand uniquely identifies
     * the sensor for data updates.
     */

    element.dataset.device =
        deviceName;

    element.dataset.shorthand =
        sensor.shorthand;


    /*
     * Sensor name
     */

    const nameElement =
        document.createElement(
            "span"
        );

    nameElement.className =
        "sensor-name";

    nameElement.textContent =
        sensor.name || sensor.shorthand;


    /*
     * Sensor value
     */

    const valueElement =
        document.createElement(
            "span"
        );

    valueElement.className =
        "sensor-value missing";

    valueElement.textContent =
        "N/A";


    /*
     * Store the configured format.
     */

    valueElement.dataset.format =
        sensor.format || "";


    element.appendChild(
        nameElement
    );

    element.appendChild(
        valueElement
    );


    return element;
}


/*
 * Format a sensor value according to
 * its configuration.
 *
 * For now the format is treated as
 * a simple JavaScript-style template
 * containing {value}.
 *
 * Examples:
 *
 *   "{value} °C"
 *   "{value} mbar"
 *   "{value} %"
 *
 */

function formatSensorValue(
    value,
    format
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "N/A";
    }


    if (!format) {

        return String(value);
    }


    return format.replace(
        "{value}",
        value
    );
}


/*
 * Update the displayed values.
 *
 * IMPORTANT:
 *
 * The DOM elements are NOT recreated.
 * Only the value text is changed.
 */

function displaySensorData(data) {

    const sensorElements =
        document.querySelectorAll(
            ".sensor-entry"
        );


    for (
        const element
        of sensorElements
    ) {

        const device =
            element.dataset.device;

        const shorthand =
            element.dataset.shorthand;


        /*
         * Find the corresponding value
         * in the data returned by Flask.
         */

        let value;


        if (
            data[device] &&
            data[device][shorthand] !== undefined
        ) {

            value =
                data[device][shorthand];

        }
        else {

            value = null;
        }


        /*
         * Find the value element.
         */

        const valueElement =
            element.querySelector(
                ".sensor-value"
            );


        /*
         * Apply configured format.
         */

        const format =
            valueElement.dataset.format;


        valueElement.textContent =
            formatSensorValue(
                value,
                format
            );


        /*
         * Visually distinguish missing
         * values.
         */

        if (
            value === null ||
            value === undefined
        ) {

            valueElement.classList.add(
                "missing"
            );

        }
        else {

            valueElement.classList.remove(
                "missing"
            );
        }
    }
}


/*
 * Load available sensor files.
 */

async function loadFiles() {

    try {

        const response =
            await fetch(

                "{{ url_for('hardware-control.get_files') }}",

                {
                    showLoader: false
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load sensor files."
            );
        }


        const files =
            await response.json();


        for (
            const filename
            of files
        ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                filename;


            option.textContent =
                filename;


            fileSelect.appendChild(
                option
            );
        }


        if (files.length === 0) {

            statusElement.textContent =
                "No sensor files found.";
        }

    }
    catch (error) {

        console.error(
            "Could not load files:",
            error
        );


        statusElement.textContent =
            "Could not load available sensor files.";
    }
}


/*
 * Load sensor data from the selected
 * file.
 */

async function updateSensorData() {

    const filename =
        fileSelect.value;


    if (!filename) {

        return;
    }


    try {

        const url =
            "{{ url_for('hardware-control.get_sensor_data') }}"
            + "?file="
            + encodeURIComponent(
                filename
            );


        const response =
            await fetch(

                url,

                {
                    /*
                     * VERY IMPORTANT:
                     *
                     * Sensor polling must not
                     * activate the global loader.
                     */
                    showLoader: false
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load sensor data."
            );
        }


        const data =
            await response.json();


        displaySensorData(
            data
        );


        statusElement.textContent =
            "Last update: "
            + new Date()
                .toLocaleTimeString();

    }
    catch (error) {

        console.error(
            "Could not update sensor data:",
            error
        );


        statusElement.textContent =
            "Error loading sensor data.";
    }
}


/*
 * Start polling.
 */

function startPolling() {

    /*
     * Invalidate any existing polling
     * loop.
     */

    pollingGeneration++;


    const generation =
        pollingGeneration;


    if (updateTimeout !== null) {

        clearTimeout(
            updateTimeout
        );

        updateTimeout = null;
    }


    async function updateLoop() {

        /*
         * Stop if another polling loop
         * has become active.
         */

        if (
            generation !==
            pollingGeneration
        ) {

            return;
        }


        await updateSensorData();


        /*
         * Check again after the request.
         */

        if (
            generation !==
            pollingGeneration
        ) {

            return;
        }


        /*
         * Wait one second before the
         * next update.
         */

        updateTimeout =
            setTimeout(
                updateLoop,
                1000
            );
    }


    /*
     * Update immediately.
     */

    updateLoop();
}


/*
 * Handle file selection.
 */

fileSelect.addEventListener(
    "change",
    () => {

        /*
         * Clear old values.
         *
         * The layout itself remains
         * completely untouched.
         */

        const valueElements =
            document.querySelectorAll(
                ".sensor-value"
            );


        for (
            const element
            of valueElements
        ) {

            element.textContent =
                "N/A";

            element.classList.add(
                "missing"
            );
        }


        if (!fileSelect.value) {

            statusElement.textContent =
                "No sensor file selected.";

            pollingGeneration++;

            if (updateTimeout !== null) {

                clearTimeout(
                    updateTimeout
                );

                updateTimeout = null;
            }

            return;
        }


        statusElement.textContent =
            "Loading sensor data...";


        startPolling();
    }
);


/*
 * Build the static UI first.
 */

createHardwareLayout();


/*
 * Then load available data files.
 */

loadFiles();


</script>

{% endblock %}
