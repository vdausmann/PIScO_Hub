{% extends 'base.html' %}
{% block content %}
<h1>Hardware Control Dashboard</h1>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">

	<a href="{{ url_for('hardware-sensor-display.hub') }}" style="text-decoration:none; color:inherit;">
		<div style="background:var(--card); padding:20px; border-radius:12px; border: 2px solid var(--accent);">
			<h3>Sensor Display</h3>
			<p>Display current sensor data.</p>
		</div>
	</a>

	<a href="{{ url_for('hardware-device-control.hub') }}" style="text-decoration:none; color:inherit;">
		<div style="background:var(--card); padding:20px; border-radius:12px; border: 2px solid var(--accent);">
			<h3>Control Devices</h3>
			<p>See current device settings and send new commands.</p>
		</div>
	</a>

	<a href="{{ url_for('ladcp.page') }}" style="text-decoration:none; color:inherit;">
		<div style="background:var(--card); padding:20px; border-radius:12px; border: 2px solid var(--accent);">
			<h3>LADCP</h3>
			<p>Set up, start, watch and download the two lowered ADCPs.</p>
		</div>
	</a>

</div>
{% endblock %}
